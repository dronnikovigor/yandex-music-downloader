[build-system]
requires = [
    "setuptools",
    "setuptools-git"
]
build-backend = "setuptools.build_meta"

[project]
name = "yandex-music-downloader-api"
version = "3.6.0"
description = "Загрузчик музыки с сервиса Яндекс.Музыка"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "yandex-music @ https://github.com/llistochek/yandex-music-api/archive/d844e4770e0263415139c05d2e94ae735b0fca14.zip",
    "mutagen>=1.47.0",
    "StrEnum",
    "pycryptodome"
]

[project.scripts]
yandex-music-downloader-api = "ymd.cli:main"
